name: Release peer review skill

on:
  push:
    tags:
      - "peer-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < peer/plugins/nickfarm27-pr-review/VERSION)"
          test "$GITHUB_REF_NAME" = "peer-v$version"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build peer-only release assets
        run: peer/bin/package-release dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Nicholas PR Review ${GITHUB_REF_NAME#peer-v}" \
            --generate-notes
