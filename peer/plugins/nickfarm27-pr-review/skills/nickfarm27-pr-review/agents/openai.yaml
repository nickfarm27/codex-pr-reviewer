interface:
  display_name: "Nickfarm27 PR Review"
  short_description: "Run Nicholas's high-signal PR review"
  default_prompt: "Use $nickfarm27-pr-review to review the pull request for my current branch."

dependencies:
  tools:
    - type: "mcp"
      value: "nickfarm27-linear-readonly"
      description: "Read-only Linear context for linked issues and projects"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp/readonly"

policy:
  allow_implicit_invocation: false
